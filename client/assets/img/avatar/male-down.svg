  <stop offset="100%" stop-color="#262c3b"/>
</linearGradient>
<linearGradient id="skinG" x1="0.3" y1="0" x2="0.5" y2="1">
  <stop offset="0%" stop-color="#f6d9c4"/>
  <stop offset="100%" stop-color="#e0b79a"/>
</linearGradient>
<linearGradient id="clothG" x1="0.2" y1="0" x2="0.4" y2="1">
  <stop offset="0%" stop-color="#6d7d9c"/>
  <stop offset="100%" stop-color="#3d4860"/>
</linearGradient>
<linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
  <stop offset="80%" stop-color="#0b0a10" stop-opacity="0"/>
  <stop offset="100%" stop-color="#0b0a10" stop-opacity="1"/>
</linearGradient></defs>
<!-- 光晕 -->
<ellipse cx="230" cy="256" rx="196" ry="210" fill="url(#aura)"/>
