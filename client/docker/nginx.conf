# ============================================================
#   nginx 站点配置
#
# 放在 conf.d/ 下，会被自动 include 进 http {}，
# 所以 server 块之外的指令属于 http 上下文（gzip / add_header 等）。
# ⚠️ 但 location 只能写在 server 里面，下面全部已收进 server。
# ============================================================

# ---------- HTTP 上下文 ----------
# 后端 helmet 已经加过一轮，这里针对 nginx 直接吐出的静态资源
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

# ⚠️ charset 必须显式声明。
#
# 不写的话 nginx 返回的是 Content-Type: text/html（没有 charset），
# 浏览器只能靠 HTML 里的 <meta charset> 兜底。
# 页面本身勉强能显示，但凡是被 fetch/XHR 拿到、或被代理转发的中文
# 就可能乱码 —— 演示时出现中文乱码是致命的。
charset utf-8;
# 源码文件已经是 UTF-8，禁止 nginx 再转一次，否则会二次编码变乱码
source_charset utf-8;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 本项目没有上传，但防一手
    client_max_body_size 2m;

    # ---------- 运行时配置 ----------
    # api.js 先读 window.LOVE_API_BASE。
    # 留空 = 走同源相对路径，由下面的 /api 反代兜住（生产推荐）。
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        default_type application/javascript;
    }

    # ---------- 健康检查 ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后端开了 trust proxy，真实 IP 从 X-Forwarded-For 取，必须透传
        # 否则按 IP 限流会把所有玩家算成同一个 IP
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # 429 的 Retry-After 要原样传给前端，别吞掉
        proxy_intercept_errors off;
    }

    # ---------- 静态资源 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ---------- 背景音乐 ----------
    # 单独一个 location，因为音频对缓存和 Range 的要求跟静态资源不一样：
    #
    # 1. Accept-Ranges 必须开启 —— 否则浏览器无法拖动进度条，
    #    部分播放器（尤其 Safari）甚至无法播放长音频。
    #    nginx 默认对静态文件就支持 Range，但显式声明更保险。
    # 2. 强缓存 —— 音频文件不会变，缓存久一点省流量，
    #    对纳新演示时的加载速度影响很明显。
    # 3. MIME 必须正确 —— 错了浏览器会拒绝解码。
    location ^~ /assets/audio/ {
        types {
            audio/mpeg  mp3;
            audio/mp4   m4a;
            audio/ogg   ogg;
        }
        default_type audio/mpeg;
        add_header Accept-Ranges bytes;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ---------- 入口 ----------
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}