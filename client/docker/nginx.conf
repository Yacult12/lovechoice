# ============================================================
#   nginx 站点配置
#
# 放在 conf.d/ 下，会被自动 include 进 http {}，
# 所以 server 块之外的指令属于 http 上下文（gzip / add_header 等）。
# ⚠️ 但 location 只能写在 server 里面，下面全部已收进 server。
# ============================================================

# ---------- HTTP 上下文 ----------
# 后端 helmet 已经加过一轮，这里针对 nginx 直接吐出的静态资源
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 本项目没有上传，但防一手
    client_max_body_size 2m;

    # ---------- 运行时配置 ----------
    # api.js 先读 window.LOVE_API_BASE。
    # 留空 = 走同源相对路径，由下面的 /api 反代兜住（生产推荐）。
    location = /config.js {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires -1;
        default_type application/javascript;
    }

    # ---------- 健康检查 ----------
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------- API 反代 ----------
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 后端开了 trust proxy，真实 IP 从 X-Forwarded-For 取，必须透传
        # 否则按 IP 限流会把所有玩家算成同一个 IP
        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;

        # 429 的 Retry-After 要原样传给前端，别吞掉
        proxy_intercept_errors off;
    }

    # ---------- 静态资源 ----------
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
        try_files $uri =404;
    }

    # ---------- 入口 ----------
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}