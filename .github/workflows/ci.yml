# ============================================================
#   CI 流水线
#
#   触发时机：推送到 main / 发起 PR / 手动运行
#
#   两个 job：
#     lint      —— 语法检查 + 静态校验（不需要数据库，10秒出结果）
#     test      —— 完整测试（起 MySQL 服务容器，跑全部断言）
#
#   为什么要分两个：语法错误应该 10 秒内报错，而不是让人等 3 分钟拉镜像。
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的新提交取消旧任务，避免排队
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 必须精确到 22.20，不能只写 22。
  #
  # .smoke 下的 jsdom@30 依赖 undici@8，后者会调用
  # zlib.createZstdDecompress。这个 API 是 Node 22.15 才引入的，
  # 实测 22.14 仍然是 undefined，加载时直接抛：
  #   TypeError: Cannot read properties of undefined (reading 'bind')
  #
  # 本地开发用的是 Node 24，本地永远跑得通，
  # 只有 CI 会炸 —— 所以这里必须与本地对齐，且要够新。
  NODE_VERSION: '22.20'

jobs:
  # ==========================================================
  # 快速检查：语法 + 静态校验
  # ==========================================================
  lint:
    name: 语法与静态检查
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装后端依赖
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: 语法检查（后端）
        run: |
          find server/src server/scripts -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      - name: 语法检查（前端与测试）
        run: |
          # 必须排除 node_modules —— .smoke 下装了 playwright，有 600+ 个 JS 文件
          find client/assets/js -type f -name '*.js' -print0 \
            | xargs -0 -n1 node --check
          find .smoke -type d -name node_modules -prune -o \
                   -type f -maxdepth 1 -name '*.js' -print0 \
            | xargs -0 -n1 node --check

      # ⚠️ 历史上踩过的坑：Windows 下带 BOM 的 JS 能正常跑，
      # 但 Linux/Node 上会直接抛 SyntaxError。
      # 症状是「本地全过、CI 秒挂」，极难排查，所以在流水线里显式拦截。
      - name: 检查 UTF-8 BOM
        run: |
          failed=0
          # 用 -type f 挡掉目录；-name node_modules -prune 排掉所有层级的依赖目录
          # （只写 -path ./node_modules 不够，依赖实际在 server/ 和 .smoke/ 下）
          while IFS= read -r -d '' f; do
            [ -f "$f" ] || continue
            if [ "$(head -c 3 "$f" | od -An -tx1 | tr -d ' \n')" = "efbbbf" ]; then
              echo "❌ $f 含 UTF-8 BOM（Linux 上会解析失败）"
              failed=1
            fi
          done < <(find . -type d -name node_modules -prune -o \
                   -type f \
                   \( -name '*.js' -o -name '*.json' -o -name '*.md' \
                      -o -name '*.yml' -o -name '*.sql' \) -print0)
          if [ "$failed" -ne 0 ]; then
            echo "请用无 BOM 的 UTF-8 重新保存上述文件（node .smoke/fix-encoding.js）"
            exit 1
          fi
          echo "✅ 无 BOM 文件"

      # ---------- lint job ----------
      - name: 校验 Node 版本满足 undici 的 zstd 依赖
        working-directory: .smoke
        run: |
          # jsdom@30 → undici@8 → zlib.createZstdDecompress（Node 22.15+）
          # 这类「本地能跑、CI 挂」的版本差异靠人肉记忆迟早再犯，
          # 直接在流水线里断言，把问题拦在测试之前。
          HAS_ZSTD=$(node -e "console.log(typeof require('zlib').createZstdDecompress)")
          if [ "$HAS_ZSTD" != "function" ]; then
            echo "❌ 当前 Node $(node --version) 缺少 zlib.createZstdDecompress"
            echo "   jsdom@30 依赖的 undici@8 会因此崩溃。"
            echo "   需要 Node >= 22.15（实测 22.14 仍失败，22.20 可用）"
            exit 1
          fi
          echo "✅ Node $(node --version) 满足要求"

      - name: 校验 .env 未被提交
        run: |
          if git ls-files --error-unmatch server/.env 2>/dev/null; then
            echo "❌ server/.env 被提交了！这是密钥泄漏，必须撤销该文件"
            exit 1
          fi
          echo "✅ .env 未入库"

      - name: Docker 配置静态校验
        run: node .smoke/verify-docker.js

  # ==========================================================
  # 完整测试：起 MySQL，跑全部断言
  # ==========================================================
  test:
    name: 接口与玩法测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: lint

    # 本地跑测试时不需要限流，否则会互相干扰
    env:
      NODE_ENV: development
      RATE_LIMIT_ENABLED: 'false'

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: 123456
          MYSQL_DATABASE: love
          TZ: Asia/Shanghai
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p123456"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
          --health-start-period=40s

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: 安装后端依赖
        working-directory: server
        run: npm ci --no-audit --no-fund

      - name: 安装测试依赖
        working-directory: .smoke
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 写入后端配置
        working-directory: server
        run: |
          cat > .env <<EOF
          NODE_ENV=development
          PORT=3000
          DB_HOST=127.0.0.1
          DB_PORT=3306
          DB_USER=root
          DB_PASSWORD=123456
          DB_NAME=love
          JWT_SECRET=ci-only-secret-not-for-production-use-1234567890
          BCRYPT_ROUNDS=4
          RATE_LIMIT_ENABLED=false
          EOF

      - name: 建表并灌入剧情
        run: |
          # 顺序很重要：base_data.sql 必须排在 full_story.sql 前面，
          # 否则 full_story 的 @r_male / @r_female 取到 NULL，
          # 报 ERROR 1048: Column 'route_id' cannot be null
          mysql -h127.0.0.1 -P3306 -uroot -p123456 love < server/sql/schema.sql
          mysql -h127.0.0.1 -P3306 -uroot -p123456 love < server/sql/base_data.sql
          mysql -h127.0.0.1 -P3306 -uroot -p123456 love < server/sql/full_story.sql
          mysql -h127.0.0.1 -P3306 -uroot -p123456 love < server/sql/expand_dialogue.sql
          mysql -h127.0.0.1 -P3306 -uroot -p123456 love < server/sql/avatars.sql

      - name: 校验 schema.sql 可干净导入
        run: node .smoke/verify-schema.js

      - name: 校验从零建库全流程
        run: node .smoke/verify-bootstrap.js

      - name: 校验数据完整性
        run: |
          set -e
          q() { mysql -h127.0.0.1 -uroot -p123456 -N -B love -e "$1"; }
          echo "  路由   : $(q 'SELECT COUNT(*) FROM routes')"
          echo "  章节   : $(q 'SELECT COUNT(*) FROM chapters')"
          echo "  节点   : $(q 'SELECT COUNT(*) FROM scene_nodes')"
          echo "  选项   : $(q 'SELECT COUNT(*) FROM choices')"
          echo "  结局   : $(q 'SELECT COUNT(*) FROM endings')"
          test "$(q 'SELECT COUNT(*) FROM routes')" = "2"
          test "$(q 'SELECT COUNT(*) FROM chapters')" = "10"
          test "$(q 'SELECT COUNT(*) FROM endings')" = "8"
          echo "✅ 数据完整"

      - name: 启动后端
        working-directory: server
        run: |
          node src/server.js &
          echo $! > /tmp/backend.pid
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/api/health > /dev/null; then
              echo "✅ 后端就绪"
              exit 0
            fi
            sleep 2
          done
          echo "❌ 后端启动超时"
          exit 1

      - name: 启动前端
        working-directory: client
        run: |
          npx --yes serve -l 5500 . &
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:5500/ > /dev/null; then
              echo "✅ 前端就绪"
              exit 0
            fi
            sleep 1
          done
          echo "❌ 前端启动失败"
          exit 1

      - name: 结局穷举验证
        working-directory: server
        run: npm run test:endings

      - name: 数据库结构检查
        working-directory: server
        run: npm run db:check

      - name: API 全量审计（72 项）
        working-directory: .smoke
        run: node api-audit.js

      - name: 冒烟测试（45 项）
        working-directory: .smoke
        run: node smoke.js

      - name: 越权隔离验证（9 项）
        working-directory: .smoke
        run: node authz-final.js

      - name: 限流验证（16 项，独立端口）
        working-directory: .smoke
        run: node verify-ratelimit.js

      - name: 结局卡布局验证（14 项）
        working-directory: .smoke
        run: node verify-ending-card.js

      - name: 背景音乐轮播时序验证（15 项）
        working-directory: .smoke
        run: node verify-music-rotation.js

      - name: 汇总
        if: always()
        run: |
          echo "=== 测试结束 ==="
          curl -s http://127.0.0.1:3000/api/health | head -c 400 || true
          echo ""
